name: sync-pstack

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 同一时刻只跑一个同步,避免并发抢同一个 tag 序号
concurrency:
  group: sync-pstack
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch upstream
        run: |
          rm -rf upstream
          git clone --depth 1 --filter=blob:none --sparse https://github.com/cursor/plugins.git upstream
          git -C upstream sparse-checkout set pstack

      - name: Detect change
        id: detect
        run: |
          # 只比 pstack 子树:上游其余目录的提交不该触发全量重算
          # pstackTree 缺失时(旧 pin)判为有变更,补一次同步把该字段写回
          OLD=$(jq -r '.pstackTree // empty' pin.json)
          NEW=$(git -C upstream rev-parse HEAD)
          NEW_TREE=$(git -C upstream rev-parse HEAD:pstack)
          PIN_VERSION=$(jq -r '.version // empty' pin.json)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          CHANGED=yes
          if [ -n "$OLD" ] && [ "$OLD" = "$NEW_TREE" ]; then CHANGED=no; fi
          # 自愈:pin 说已同步,但该版本没有任何 release,下游就拿不到通用版产物。
          # 只看子树哈希会让这种状态永远短路,所以发布缺失同样判为有变更。
          if [ "$CHANGED" = no ] && [ -n "$PIN_VERSION" ]; then
            if ! RELEASED=$(gh release list --limit 200 --json tagName --jq '.[].tagName'); then
              # 查不到发布状态时往「重跑」方向倒:宁可多做一次,不可静默跳过发布
              echo "::warning::cannot list releases; treating as changed so publication is retried"
              RELEASED=""
            fi
            MATCH=$(printf '%s\n' "$RELEASED" | grep -c "^pstack-${PIN_VERSION}-r[0-9]" || true)
            if [ "$MATCH" = 0 ]; then
              CHANGED=yes
              echo "self-heal: no release published for pinned version ${PIN_VERSION}"
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Transform
        if: steps.detect.outputs.changed == 'yes'
        shell: pwsh
        run: ./transform/scripts/transform.ps1 -Upstream upstream/pstack -Out output -OutCc .

      - name: Validate gates
        if: steps.detect.outputs.changed == 'yes'
        shell: pwsh
        run: |
          # 留存门输出供失败告警引用,否则告警只有 run 链接,定位必须翻日志
          $out = & ./transform/scripts/validate.ps1 -Root . 2>&1
          $code = $LASTEXITCODE
          $text = $out -join "`n"
          Set-Content -Path gate-report.txt -Value $text -Encoding utf8
          Write-Output $text
          exit $code

      - name: Record upstream
        if: steps.detect.outputs.changed == 'yes'
        run: |
          NEW=$(git -C upstream rev-parse HEAD)
          NEW_TREE=$(git -C upstream rev-parse HEAD:pstack)
          NEW_DATE=$(git -C upstream log -1 --format=%cd --date=short)
          VERSION=$(jq -r .version plugins/pstack/.claude-plugin/plugin.json)
          jq --arg c "$NEW" --arg t "$NEW_TREE" --arg v "$VERSION" --arg d "$NEW_DATE" '.commit=$c | .pstackTree=$t | .version=$v | .date=$d' pin.json > pin.tmp && mv pin.tmp pin.json
          echo "UPSTREAM=$NEW" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit
        if: steps.detect.outputs.changed == 'yes'
        run: |
          # 固定提交身份:不依赖 github.actor(cron 与手动触发的 actor 语义不同)
          git config user.name "lab-GESTALT"
          git config user.email "lab-GESTALT@users.noreply.github.com"
          git add plugins .claude-plugin pin.json
          # 「无变更」是显式判断,不是把 commit 的失败吞掉:自愈路径下产物本来就相同,
          # 而真正的 commit 失败(钩子、身份、索引)必须让这一步红。
          if git diff --cached --quiet; then
            echo "nothing to commit: derived artifact already matches upstream"
          else
            git commit -m "sync: pstack ${VERSION} (upstream ${UPSTREAM})"
          fi

      - name: Tag and push
        if: steps.detect.outputs.changed == 'yes'
        run: |
          # 远端可能在本次运行期间前进(人工推送)。先 rebase 再推,被拒则重取重试;
          # 冲突不是瞬时故障,abort 后直接红,不做无意义的重试。
          rebase_onto_remote() {
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::rebase onto origin/main conflicted; manual resolution required"
              return 1
            fi
          }
          rebase_onto_remote
          if ! git push origin HEAD:main; then
            echo "::warning::push rejected; refetch and retry once"
            rebase_onto_remote
            git push origin HEAD:main
          fi
          # checkout 不取 tag(fetch-tags: false),序号必须向远端查询,否则同版本二次同步会撞名。
          # 推送后再查:此时远端状态才是权威的。
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_TAGS=$(git ls-remote --tags origin "refs/tags/pstack-${VERSION}-r*")
          # 同版本同树重跑(自愈)复用已有 tag,不制造指向同一棵树的空标签
          # 用 here-string 而非管道:pipefail 下 break 提前关管道会让 printf 收到 SIGPIPE,整步误红
          T=""
          while read -r sha ref; do
            if [ "$sha" = "$HEAD_SHA" ]; then T="${ref#refs/tags/}"; break; fi
          done <<< "$REMOTE_TAGS"
          if [ -z "$T" ]; then
            N=$(printf '%s\n' "$REMOTE_TAGS" | grep -c 'refs/tags/' || true)
            T="pstack-${VERSION}-r$((N+1))"
            git tag "$T"
            git push origin "refs/tags/$T"
          fi
          echo "TAG=$T" >> "$GITHUB_ENV"

      - name: Publish release
        if: steps.detect.outputs.changed == 'yes'
        run: |
          (cd output && zip -q -r "../${TAG}.zip" .)
          # 发布失败必须让这一步红:此前 || echo 会把失败吞成绿,pin 却已前进,
          # 下一次 cron 因树哈希相同而短路,通用版产物永远发不出去。
          # 已存在则跳过,使自愈路径可重复执行而不撞名。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; skipping create"
          else
            gh release create "$TAG" "${TAG}.zip" --title "pstack ${VERSION} (generic)" --notes "Auto-synced from cursor/plugins@${UPSTREAM}"
          fi
          rm -f "${TAG}.zip"

      - name: Alert on failure
        if: failure()
        run: |
          NEW=$(git -C upstream rev-parse HEAD 2>/dev/null || echo unknown)
          BODY="pstack sync pipeline failed. See run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. pin.json unchanged; next cron will retry."
          # 带上失败门的实际输出,让 issue 自身可定位;FENCE 用单引号避免 bash 把反引号当命令替换
          # 用 printf 单行构造:块标量里不能出现顶格行,否则 YAML 解析失败
          if [ -f gate-report.txt ]; then
            FENCE='```'
            BODY=$(printf '%s\n\nGate output:\n%s\n%s\n%s' "$BODY" "$FENCE" "$(tail -n 20 gate-report.txt)" "$FENCE")
          fi
          # 同一故障持续存在时并入同一 issue,不重复刷屏
          EXISTING=$(gh issue list --state open --limit 100 --json number,title --jq '[.[] | select(.title | startswith("sync failed:"))][0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "upstream ${NEW}: ${BODY}" || echo "::warning::alert comment failed"
          else
            gh issue create --title "sync failed: upstream ${NEW}" --body "$BODY" || echo "::warning::alert create failed"
          fi

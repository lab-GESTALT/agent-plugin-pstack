name: sync-pstack

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream
        run: |
          rm -rf upstream
          git clone --depth 1 --filter=blob:none --sparse https://github.com/cursor/plugins.git upstream
          git -C upstream sparse-checkout set pstack

      - name: Detect change
        id: detect
        run: |
          OLD=$(jq -r .commit pin.json)
          NEW=$(git -C upstream rev-parse HEAD)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then echo "changed=no" >> "$GITHUB_OUTPUT"; else echo "changed=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Transform
        if: steps.detect.outputs.changed == 'yes'
        shell: pwsh
        run: ./transform/scripts/transform.ps1 -Upstream upstream/pstack -Out output -OutCc .

      - name: Validate gates
        if: steps.detect.outputs.changed == 'yes'
        shell: pwsh
        run: ./transform/scripts/validate.ps1 -Root .

      - name: Commit, tag, release
        if: steps.detect.outputs.changed == 'yes'
        run: |
          NEW=$(git -C upstream rev-parse HEAD)
          VERSION=$(jq -r .version plugins/pstack/.claude-plugin/plugin.json)
          jq --arg c "$NEW" '.commit=$c' pin.json > pin.tmp && mv pin.tmp pin.json
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add plugins .claude-plugin pin.json
          git commit -m "sync: pstack ${VERSION} (upstream ${NEW})" || echo "nothing to commit"
          N=$(git tag -l "pstack-${VERSION}-r*" | wc -l)
          T="pstack-${VERSION}-r$((N+1))"
          git tag "$T"
          git push origin HEAD:main --tags
          (cd output && zip -q -r "../${T}.zip" .)
          gh release create "$T" "${T}.zip" --title "pstack ${VERSION} (generic)" --notes "Auto-synced from cursor/plugins@${NEW}" || echo "release create skipped"
          rm -f "${T}.zip"

      - name: Alert on failure
        if: failure()
        run: |
          NEW=$(git -C upstream rev-parse HEAD 2>/dev/null || echo unknown)
          gh issue create --title "sync failed: upstream ${NEW}" --body "pstack sync pipeline failed. See run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. pin.json unchanged; next cron will retry." || echo "alert skipped"

name: sync-pstack

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 同一时刻只跑一个同步,避免并发抢同一个 tag 序号
concurrency:
  group: sync-pstack
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream
        run: |
          rm -rf upstream
          git clone --depth 1 --filter=blob:none --sparse https://github.com/cursor/plugins.git upstream
          git -C upstream sparse-checkout set pstack

      - name: Detect change
        id: detect
        run: |
          # 只比 pstack 子树:上游其余目录的提交不该触发全量重算
          # pstackTree 缺失时(旧 pin)判为有变更,补一次同步把该字段写回
          OLD=$(jq -r '.pstackTree // empty' pin.json)
          NEW=$(git -C upstream rev-parse HEAD)
          NEW_TREE=$(git -C upstream rev-parse HEAD:pstack)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$OLD" ] && [ "$OLD" = "$NEW_TREE" ]; then echo "changed=no" >> "$GITHUB_OUTPUT"; else echo "changed=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Transform
        if: steps.detect.outputs.changed == 'yes'
        shell: pwsh
        run: ./transform/scripts/transform.ps1 -Upstream upstream/pstack -Out output -OutCc .

      - name: Validate gates
        if: steps.detect.outputs.changed == 'yes'
        shell: pwsh
        run: |
          # 留存门输出供失败告警引用,否则告警只有 run 链接,定位必须翻日志
          $out = & ./transform/scripts/validate.ps1 -Root . 2>&1
          $code = $LASTEXITCODE
          $text = $out -join "`n"
          Set-Content -Path gate-report.txt -Value $text -Encoding utf8
          Write-Output $text
          exit $code

      - name: Record upstream
        if: steps.detect.outputs.changed == 'yes'
        run: |
          NEW=$(git -C upstream rev-parse HEAD)
          NEW_TREE=$(git -C upstream rev-parse HEAD:pstack)
          NEW_DATE=$(git -C upstream log -1 --format=%cd --date=short)
          VERSION=$(jq -r .version plugins/pstack/.claude-plugin/plugin.json)
          jq --arg c "$NEW" --arg t "$NEW_TREE" --arg v "$VERSION" --arg d "$NEW_DATE" '.commit=$c | .pstackTree=$t | .version=$v | .date=$d' pin.json > pin.tmp && mv pin.tmp pin.json
          echo "UPSTREAM=$NEW" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit
        if: steps.detect.outputs.changed == 'yes'
        run: |
          # 固定提交身份:不依赖 github.actor(cron 与手动触发的 actor 语义不同)
          git config user.name "TurnX-alt"
          git config user.email "225419967+TurnX-alt@users.noreply.github.com"
          git add plugins .claude-plugin pin.json
          git commit -m "sync: pstack ${VERSION} (upstream ${UPSTREAM})" || echo "::warning::nothing to commit"

      - name: Tag and push
        if: steps.detect.outputs.changed == 'yes'
        run: |
          # checkout 不取 tag(fetch-tags: false),序号必须向远端查询,否则同版本二次同步会撞名
          N=$(git ls-remote --tags origin "refs/tags/pstack-${VERSION}-r*" | wc -l)
          T="pstack-${VERSION}-r$((N+1))"
          echo "TAG=$T" >> "$GITHUB_ENV"
          git tag "$T"
          git push origin HEAD:main --tags

      - name: Publish release
        if: steps.detect.outputs.changed == 'yes'
        run: |
          (cd output && zip -q -r "../${TAG}.zip" .)
          gh release create "$TAG" "${TAG}.zip" --title "pstack ${VERSION} (generic)" --notes "Auto-synced from cursor/plugins@${UPSTREAM}" || echo "::warning::release create skipped"
          rm -f "${TAG}.zip"

      - name: Alert on failure
        if: failure()
        run: |
          NEW=$(git -C upstream rev-parse HEAD 2>/dev/null || echo unknown)
          BODY="pstack sync pipeline failed. See run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. pin.json unchanged; next cron will retry."
          # 带上失败门的实际输出,让 issue 自身可定位;FENCE 用单引号避免 bash 把反引号当命令替换
          # 用 printf 单行构造:块标量里不能出现顶格行,否则 YAML 解析失败
          if [ -f gate-report.txt ]; then
            FENCE='```'
            BODY=$(printf '%s\n\nGate output:\n%s\n%s\n%s' "$BODY" "$FENCE" "$(tail -n 20 gate-report.txt)" "$FENCE")
          fi
          # 同一故障持续存在时并入同一 issue,不重复刷屏
          EXISTING=$(gh issue list --state open --limit 100 --json number,title --jq '[.[] | select(.title | startswith("sync failed:"))][0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "upstream ${NEW}: ${BODY}" || echo "::warning::alert comment failed"
          else
            gh issue create --title "sync failed: upstream ${NEW}" --body "$BODY" || echo "::warning::alert create failed"
          fi
